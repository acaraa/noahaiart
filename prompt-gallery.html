                console.error("Copy operation error:", err);
                showToast("복사 중 에러가 발생했습니다.");
            }
            
            document.body.removeChild(tempTextArea);
        }

        function showToast(message) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            
            toastText.textContent = message;
            toast.style.transform = "translateY(0)";
            toast.style.opacity = "1";
            toast.style.pointerEvents = "auto";

            setTimeout(() => {
                toast.style.transform = "translateY(40px)";
                toast.style.opacity = "0";
                toast.style.pointerEvents = "none";
            }, 3000);
        }

        function setupSidebar() {
        const sidebarList = document.getElementById('sidebar-list');
        sidebarList.innerHTML = '';

        slides.forEach((slide, idx) => {
            let label = `[${slide.category[0]}] ${slide.category} (${slide.indexRange})`;
            let iconClass = 'fa-solid fa-layer-group';

            sidebarList.innerHTML += `
                <button onclick="jumpToSlide(${idx})" class="w-full text-left p-2.5 rounded hover:bg-[#2d2a27] text-museumGray hover:text-white transition-all flex items-center gap-3 sidebar-slide-btn" data-index="${idx}">
                    <i class="${iconClass} text-museumGold"></i>
                    <span class="truncate">${label}</span>
                </button>
            `;
        });

        // 사이드바 개폐 이벤트 등록
        document.getElementById('sidebar-toggle-btn').addEventListener('click', () => {
            document.getElementById('slide-sidebar').classList.toggle('translate-x-full');
        });
        document.getElementById('sidebar-close-btn').addEventListener('click', () => {
            document.getElementById('slide-sidebar').classList.add('translate-x-full');
        });
    }

    function jumpToSlide(idx) {
            currentSlideIndex = idx;
            renderSlide(currentSlideIndex);
            // 모바일 배려 사이드바 자동 은닉
            if (window.innerWidth < 1024) {
                document.getElementById('slide-sidebar').classList.add('translate-x-full');
            }
        }

        function updateActiveIndexClass() {
            const buttons = document.querySelectorAll('.sidebar-slide-btn');
            buttons.forEach(btn => {
                const idx = parseInt(btn.getAttribute('data-index'));
                if (idx === currentSlideIndex) {
                    btn.classList.add('bg-[#2d2a27]', 'text-white', 'border-l-2', 'border-museumGold');
                } else {
                    btn.classList.remove('bg-[#2d2a27]', 'text-white', 'border-l-2', 'border-museumGold');
                }
            });
        }

        function toggleAutoplay() {
            const autoplayBtn = document.getElementById('autoplay-btn');
            
            if (isAutoplayActive) {
                clearInterval(autoplayTimer);
                isAutoplayActive = false;
                autoplayBtn.innerHTML = `<i class="fa-solid fa-play"></i> 자동 재생`;
                autoplayBtn.classList.remove('bg-museumGold', 'text-white');
                autoplayBtn.classList.add('bg-[#2d2a27]', 'text-museumGold');
            } else {
                isAutoplayActive = true;
                autoplayBtn.innerHTML = `<i class="fa-solid fa-pause"></i> 일시 정지`;
                autoplayBtn.classList.remove('bg-[#2d2a27]', 'text-museumGold');
                autoplayBtn.classList.add('bg-museumGold', 'text-[#121110]');
                
                autoplayTimer = setInterval(() => {
                    nextSlide();
                }, 6000); // 6초마다 페이지 전환
            }
        }

        function nextSlide() {
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            renderSlide(currentSlideIndex);
        }

        function prevSlide() {
            currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            renderSlide(currentSlideIndex);
        }

        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase().trim();
                const sidebarList = document.getElementById('sidebar-list');
                
                if (q === '') {
                    setupSidebar();
                    return;
                }

                sidebarList.innerHTML = '<div class="text-museumGray p-2">검색 결과:</div>';

                // 스타일 데이터 1차 필터링
                const filtered = stylesData.filter(s => 
                    s.nameKo.toLowerCase().includes(q) || 
                    s.nameEn.toLowerCase().includes(q) || 
                    s.prompt.toLowerCase().includes(q)
                );

                if (filtered.length === 0) {
                    sidebarList.innerHTML += '<div class="text-museumGray p-2 text-center">검색 결과가 없습니다.</div>';
                    return;
                }

                filtered.forEach(p => {
                    // 해당 카드가 속해 있는 슬라이드 인덱스 역탐색
                    const slideIdx = slides.findIndex(slide => 
                        slide.type === 'content' && slide.prompts.some(item => item.id === p.id)
                    );

                    sidebarList.innerHTML += `
                        <button onclick="jumpToSlide(${slideIdx})" class="w-full text-left p-2 rounded hover:bg-[#2d2a27] text-white transition-all flex flex-col gap-1 border-b border-cardBorder/10">
                            <div class="flex items-center gap-2">
                                <span class="text-museumGold font-bold text-[10px] font-cinzel">${p.id}</span>
                                <span class="font-serifKr text-xs font-semibold text-white">${p.nameKo}</span>
                            </div>
                            <span class="text-[9px] text-museumGray truncate w-full">${p.prompt}</span>
                        </button>
                    `;
                });
            });
        }

        // 키보드 방향키 조작 리스너 설치
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // 시스템 진입 시 초기 기동 바인딩
        window.onload = function() {
            initSlides();
            renderSlide(currentSlideIndex);
            setupSidebar();
            setupSearch();

            // 바닥 조작반 버튼 리스너 연계
            document.getElementById('prev-btn').addEventListener('click', prevSlide);
            document.getElementById('next-btn').addEventListener('click', nextSlide);
            document.getElementById('autoplay-btn').addEventListener('click', toggleAutoplay);
        };
    </script>
</body>
</html>
